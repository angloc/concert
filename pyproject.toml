[project]
name = "concert"
description = "bide: a song rendered from a physical voice model, modelled instruments and a hand-drawn film; repository checks."
requires-python = ">=3.13"
license = "MIT"
dynamic = ["version"]
dependencies = [
    "markdown-it-py==4.3.0",
    "packaging==26.4",
    "pyyaml==6.0.4",
]

[project.scripts]
concert-band = "concert.band.render:main"
concert-fit = "concert.voice.fit:main"
concert-flac = "concert.mix.flac:main"
concert-mix = "concert.mix.mix:main"
concert-page = "concert.page.build:main"
concert-perform = "concert.performance.perform:main"
concert-preflight = "concert.review.preflight:main"
concert-record = "concert.capture.record:main"
concert-shot = "concert.capture.shot:main"
concert-sing = "concert.voice.sing:main"
concert-timeline = "concert.page.timeline:main"
baselinecheck = "repochecks.baseline:main"
doccheck = "repochecks.doccheck:main"
tagcheck = "repochecks.tagcheck:main"

[dependency-groups]
dev = [
    "coverage==7.17.5",
    "imageio-ffmpeg==0.6.0",
    "numpy==2.5.5",
    "pip-audit==2.10.1",
    "playwright==1.63.0",
    "pytest==9.2.0",
    "pytest-timeout==2.4.0",
    "ruff==0.17.6",
    "scipy==1.18.1",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "code"
path = "src/repochecks/tagcheck/version.py"
expression = "PACKAGE_VERSION"

[tool.hatch.build.targets.wheel]
packages = ["src/concert", "src/repochecks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
timeout = 60
markers = [
    "chromium: end-to-end tests in Chromium",
    "firefox: end-to-end tests in Firefox",
    "webkit: end-to-end tests in WebKit",
]

[tool.coverage.run]
# Existing code under src/concert is exempt from the floor until increment I4 (decision 0015).
source = ["src/repochecks", "src/concert/capture"]
# Playwright's synchronous API runs the page in greenlets.
concurrency = ["thread", "greenlet"]
branch = false
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.doccheck]
policy_hashes = { "POLICY.md" = "b75f38167bb58130604f0590cd6d45b159080f94d06a1c22b67bda976ea4db80", "policy/javascript.md" = "2f78a0026ee61a7d365ee8ebd3a5ece220f13c94343930fc1dc68b9ab61e1c8f", "policy/knowledge.md" = "1ef6046c34b53f01bdc1929ea885c28496d4d9a504a7ddc918ad5b454abd3e43", "policy/pull-request.md" = "4b91c8a1f7083bd68f63546514c24fb60c5e555483629a08f9901548dab4219d", "policy/python.md" = "413f5b117c17f92b36002d072e15dc0accb352e68b1ab294e7662a64c41f0004", "policy/release.md" = "eadf5227a9884fa4ab4719ad70c9069e908c10e0cfeb04897777b0c66d66d792" }
